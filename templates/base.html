<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}Essays and projects by Jean-Philippe Lejeune — finance, institutions, and the systems they run on.{% endblock %}">
  {% if canonical_url %}<link rel="canonical" href="{{ canonical_url }}">{% endif %}
  {% for l, url in alternates.items() %}<link rel="alternate" hreflang="{{ l }}" href="{{ site_url }}{{ url }}">
  {% endfor %}{% if alternates.get('en') %}<link rel="alternate" hreflang="x-default" href="{{ site_url }}{{ alternates['en'] }}">{% endif %}
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta property="og:site_name" content="{{ site_name }}">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  {% if canonical_url %}<meta property="og:url" content="{{ canonical_url }}">{% endif %}
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="/static/favicon.ico">
  <link rel="alternate" type="application/atom+xml" title="{{ site_name }}" href="/{{ lang }}/feed.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
  <script src="{{ url_for('static', filename='js/theme-init.js') }}"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" defer></script>
  <script src="{{ url_for('static', filename='js/theme-toggle.js') }}" defer></script>
</head>
<body class="min-h-screen">
  {% include "_partials/header.html" %}
  <main class="mx-auto max-w-prose px-6">{% block content %}{% endblock %}</main>
  {% include "_partials/footer.html" %}
</body>
</html>
