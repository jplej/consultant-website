<svg id="container" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 500px;" viewBox="0 0 500 500" role="graphics-document document" aria-roledescription="quadrantChart"><style>#container{font-size:17px;fill:#586e75;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#container .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#container .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#container .error-icon{fill:#eee8d5;}#container .error-text{fill:#586e75;stroke:#586e75;}#container .edge-thickness-normal{stroke-width:1px;}#container .edge-thickness-thick{stroke-width:3.5px;}#container .edge-pattern-solid{stroke-dasharray:0;}#container .edge-thickness-invisible{stroke-width:0;fill:none;}#container .edge-pattern-dashed{stroke-dasharray:3;}#container .edge-pattern-dotted{stroke-dasharray:2;}#container .marker{fill:#586e75;stroke:#586e75;}#container .marker.cross{stroke:#586e75;}#container svg{font-size:17px;}#container p{margin:0;}#container :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="main"><g class="quadrants"><g class="quadrant"><rect x="263" y="71" width="232" height="212" fill="#eee8d5"></rect><text x="0" y="0" fill="#586e75" font-size="16" dominant-baseline="middle" text-anchor="middle" transform="translate(379, 177) rotate(0)">Apparatus</text></g><g class="quadrant"><rect x="31" y="71" width="232" height="212" fill="#f3edda"></rect><text x="0" y="0" fill="#536970" font-size="16" dominant-baseline="middle" text-anchor="middle" transform="translate(147, 177) rotate(0)">Monarchy</text></g><g class="quadrant"><rect x="31" y="283" width="232" height="212" fill="#f8f2df"></rect><text x="0" y="0" fill="#4e646b" font-size="16" dominant-baseline="middle" text-anchor="middle" transform="translate(